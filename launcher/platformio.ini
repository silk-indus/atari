[env:esp32Launcher]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
lib_deps =
    https://github.com/techpaul/PS2KeyAdvanced.git
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DASYNC_TCP_SSL_ENABLED=0
